[project]
name = "sts2bot"
version = "0.1.0"
description = "A bot that plays Slay the Spire 2 around the clock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sts2bot = "sts2bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sts2bot"]
